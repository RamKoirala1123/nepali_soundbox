name: nepali_soundbox
description: A Nepali currency and payment announcement soundbox package for Flutter (eSewa / Khalti style) using high-quality pre-bundled neural audio clips.
version: 0.0.2
homepage: https://github.com/RamKoirala1123/nepali_soundbox
repository: https://github.com/RamKoirala1123/nepali_soundbox
issue_tracker: https://github.com/RamKoirala1123/nepali_soundbox/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/audio/
