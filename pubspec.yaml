name: nepali_tts
description: A Nepali text-to-speech soundbox package for currency and payment announcements (eSewa / Khalti style) using high-quality pre-generated neural audio clips.
version: 0.0.1
homepage: https://github.com/RamKoirala1123/nepali_tts
repository: https://github.com/RamKoirala1123/nepali_tts
issue_tracker: https://github.com/RamKoirala1123/nepali_tts/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/audio/
